<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Status Pesanan</title><meta name="theme-color" content="#2554f0"><meta name="robots" content="noindex">
<style>
:root{--pri:#2554f0;--pri2:#5b82ff;--bg:#eef2ff;--card:#fff;--tx:#0b1f4d;--mut:#6a789c;--line:#dbe3f7;--ok:#12a150;--ok2:#34d27b;--glow:rgba(37,84,240,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#070d22;--card:#101a3a;--tx:#eaf0ff;--mut:#9aaad2;--line:#22315e;--glow:rgba(91,130,255,.28)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
.top{position:relative;overflow:hidden;color:#fff;padding:calc(26px + env(safe-area-inset-top)) 20px 92px;background:linear-gradient(135deg,#2554f0 0%,#0b1f4d 100%)}
.top.done{background:linear-gradient(135deg,#12a150 0%,#064e3b 100%)}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.top::before{width:240px;height:240px;right:-70px;top:-90px}.top::after{width:150px;height:150px;left:-50px;bottom:-60px}
.top>*{position:relative}
.biz{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.top h1{margin:6px 0 0;font-size:24px;line-height:1.15;font-weight:800}
.no{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.18);font-size:13px;font-weight:700;backdrop-filter:blur(6px)}
.wrap{max-width:520px;margin:-66px auto 0;padding:0 14px calc(40px + env(safe-area-inset-bottom));position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 14px 40px -18px var(--glow)}
.hero{display:flex;gap:14px;align-items:center}
.ico{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 10px 24px -8px var(--pri)}
.ico.done{background:linear-gradient(135deg,var(--ok),var(--ok2));box-shadow:0 10px 24px -8px var(--ok)}
.ico svg{width:30px;height:30px}
.now{font-size:12.5px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.big{font-size:27px;line-height:1.1;font-weight:800;margin-top:3px}
.chip{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:800;background:var(--glow);color:var(--pri)}
.chip.done{background:rgba(18,161,80,.16);color:var(--ok)}
.bar{margin-top:18px}.bar .t{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);font-weight:700;margin-bottom:7px}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .9s cubic-bezier(.2,.8,.2,1);position:relative}
.fill.done{background:linear-gradient(90deg,var(--ok),var(--ok2))}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:sh 2.4s infinite}
.fill.done::after{display:none}
@keyframes sh{to{transform:translateX(100%)}}
.meta{display:grid;gap:10px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);font-size:14.5px}
.meta div{display:flex;justify-content:space-between;gap:14px}.meta span{color:var(--mut)}.meta b{text-align:right;font-weight:700}
.pay{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:800;background:rgba(18,161,80,.16);color:var(--ok)}.pay.k{background:rgba(234,150,0,.18);color:#c77700}.pay.v{background:rgba(226,59,59,.15);color:#d32f2f}
.msg{margin-top:14px;padding:12px 14px;border-radius:16px;font-size:14px;background:var(--glow);line-height:1.45}
h2{margin:0 0 16px;font-size:15px;font-weight:800;letter-spacing:.02em}
ol{list-style:none;margin:0;padding:0}
li.st{position:relative;display:flex;gap:14px;padding:0 0 24px}
li.st:last-child{padding-bottom:0}
li.st::before{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:3px;border-radius:3px;background:var(--line)}
li.st:last-child::before{display:none}
li.st.d::before{background:linear-gradient(var(--ok),var(--ok2))}
.dot{flex:none;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mut);z-index:1}
.dot svg{width:16px;height:16px}
li.st.d .dot{background:var(--ok);border-color:var(--ok);color:#fff}
li.st.c .dot{border-color:var(--pri);background:var(--pri);color:#fff;box-shadow:0 0 0 6px var(--glow);animation:pl 2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 11px transparent}}
.tx{padding-top:3px}.tx b{display:block;font-size:16px;line-height:1.25}.tx small{color:var(--mut);font-size:12.5px;font-weight:600}
li.st:not(.d):not(.c) .tx b{color:var(--mut);font-weight:600}
li.st.c .tx b{color:var(--pri);font-size:17px}
.upd{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--mut);font-size:12.5px;margin-top:4px}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl2 1.6s infinite}
@keyframes pl2{50%{opacity:.25}}
.full{min-height:78vh;display:grid;place-items:center;text-align:center;padding:30px 20px}.full .ic{font-size:54px}.full h2{margin:12px 0 6px;font-size:20px}.full p{color:var(--mut);margin:0}
.btn{margin-top:18px;border:0;border-radius:16px;background:var(--pri);color:#fff;padding:14px 26px;font-size:15.5px;font-weight:800}
.skel{height:120px;border-radius:24px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-color-scheme:dark){li.st.c .tx b,.chip{color:#8fa9ff}.chip.done{color:#3ddc84}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="top" id="top"><div class="biz" id="tn">Status Pesanan</div><h1 id="hd">Memuat status…</h1><span class="no" id="ts" style="display:none"></span></div>
<div class="wrap" id="app"><div class="skel"></div></div>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search),SID=q.get('s')||'',FULL=q.get('u')||'',TOK=(q.get('t')||'').replace(/[^A-Za-z0-9]/g,'');
var URLX=FULL||(SID?'https://script.google.com/macros/s/'+encodeURIComponent(SID)+'/exec':'');
if(URLX&&!/^https:\/\/script\.google\.com\//.test(URLX))URLX='';
var $=function(s){return document.querySelector(s)},T=null,LAST='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function two(n){return(n<10?'0':'')+n}
function fmt(ts){if(!ts)return'';var d=new Date(ts);return d.getDate()+'/'+two(d.getMonth()+1)+' · '+two(d.getHours())+':'+two(d.getMinutes())}
var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var CLK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
function full(ic,h,p,btn){$('#app').innerHTML='<div class="full"><div><div class="ic">'+ic+'</div><h2>'+esc(h)+'</h2><p>'+esc(p)+'</p>'+(btn||'')+'</div></div>';$('#hd').textContent='Status Pesanan'}
function api(){
 var c=new AbortController(),t=setTimeout(function(){c.abort()},20000);
 var u=URLX+(URLX.indexOf('?')>-1?'&':'?')+'action=qjob&id='+encodeURIComponent(TOK)+'&_='+Date.now();
 return fetch(u,{redirect:'follow',signal:c.signal}).then(function(r){return r.json()}).finally(function(){clearTimeout(t)});
}
function draw(r){
 var n=r.steps.length,last=n-1,done=r.i>=last,at={},pct=Math.round((r.i+(done?0:0.5))/last*100);
 if(done)pct=100;
 (r.hist||[]).forEach(function(h){at[h.i]=h.ts});
 document.title=(r.biz||'Status')+' · '+(r.no||'');
 $('#tn').textContent=r.biz||'Status Pesanan';
 $('#hd').textContent=done?'Pesanan Anda sudah selesai':'Pesanan Anda sedang diproses';
 $('#top').className='top'+(done?' done':'');
 var no=$('#ts');if(r.no){no.style.display='';no.textContent='No. '+r.no}
 var steps=r.steps.map(function(s,k){
  var cl=(k<r.i||(done&&k===r.i))?'d':k===r.i?'c':'';
  var when=at[k]?'<small>'+fmt(at[k])+'</small>':'';
  return'<li class="st '+cl+'"><div class="dot">'+(cl==='d'?CHK:cl==='c'?CLK:(k+1))+'</div><div class="tx"><b>'+esc(s)+'</b>'+when+'</div></li>';
 }).join('');
 $('#app').innerHTML='<div class="card"><div class="hero"><div class="ico'+(done?' done':'')+'">'+(done?CHK:CLK)+'</div><div><div class="now">Status saat ini</div><div class="big">'+esc(r.steps[r.i])+'</div><span class="chip'+(done?' done':'')+'">'+(done?'Selesai':'Diproses')+'</span></div></div>'
  +'<div class="bar"><div class="t"><span>Langkah '+(r.i+1)+' dari '+n+'</span><span>'+pct+'%</span></div><div class="track"><div class="fill'+(done?' done':'')+'" id="fl" style="width:0"></div></div></div>'
  +((r.name||r.desc||r.pay)?'<div class="meta">'+(r.name?'<div><span>Atas nama</span><b>'+esc(r.name)+'</b></div>':'')+(r.desc?'<div><span>Pesanan</span><b>'+esc(r.desc)+'</b></div>':'')+(r.pay&&r.pay.l?'<div><span>Pembayaran</span><b><span class="pay '+esc(r.pay.k)+'">'+esc(r.pay.l)+'</span></b></div>':'')+'</div>':'')
  +(r.note?'<div class="msg">'+esc(r.note)+'</div>':'')+'</div>'
  +'<div class="card"><h2>Perjalanan pesanan</h2><ol>'+steps+'</ol></div>'
  +'<div class="upd"><span class="live"></span>Diperbarui '+esc(fmt(r.upd))+' · menyegarkan otomatis</div>';
 requestAnimationFrame(function(){requestAnimationFrame(function(){var f=$('#fl');if(f)f.style.width=pct+'%'})});
}
function load(first){
 api().then(function(r){
  if(!r||!r.ok){if(first)full('⚠️','Pesanan tidak ditemukan',(r&&r.err)||'Periksa kembali link dari toko.','<button class="btn" onclick="location.reload()">Coba lagi</button>');return}
  var k=JSON.stringify([r.i,r.upd,r.note,r.pay]);if(k!==LAST){LAST=k;draw(r)}
  if(r.i>=r.steps.length-1){clearInterval(T);T=setInterval(function(){load(false)},120000)}
 }).catch(function(){if(first)full('📡','Tidak bisa memuat','Periksa koneksi internet, lalu coba lagi.','<button class="btn" onclick="location.reload()">Coba lagi</button>')});
}
if(!URLX||!TOK)full('⚠️','Link tidak valid','Minta link status yang benar dari toko.');
else{load(true);T=setInterval(function(){load(false)},15000);document.addEventListener('visibilitychange',function(){if(!document.hidden)load(false)})}
})();
</script></body></html>
