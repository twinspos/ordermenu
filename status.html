<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Status Pesanan</title><meta name="theme-color" content="#1d4ed8"><meta name="robots" content="noindex">
<style>
:root{--pri:#1d4ed8;--bg:#f3f6fd;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--ok:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#141c2f;--tx:#e8eefc;--mut:#93a1bd;--line:#26324d}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 22px}
header h1{margin:0;font-size:21px}header p{margin:4px 0 0;font-size:14px;opacity:.9}
.wrap{max-width:560px;margin:-12px auto 0;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 6px 22px rgba(15,23,42,.06)}
.now{font-size:13px;color:var(--mut)}.big{font-size:26px;font-weight:800;margin:4px 0 2px}
.chip{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(37,99,235,.12);color:var(--pri)}
.chip.done{background:rgba(22,163,74,.14);color:var(--ok)}
.info{display:grid;gap:3px;margin-top:12px;font-size:14.5px}.info span{color:var(--mut)}
ol{list-style:none;margin:0;padding:0}
li.st{position:relative;display:flex;gap:14px;padding:0 0 22px}
li.st:last-child{padding-bottom:0}
li.st::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
li.st:last-child::before{display:none}
li.st.d::before{background:var(--ok)}
.dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--mut);z-index:1}
li.st.d .dot{background:var(--ok);border-color:var(--ok);color:#fff}
li.st.c .dot{border-color:var(--pri);background:var(--pri);color:#fff;box-shadow:0 0 0 5px rgba(37,99,235,.18);animation:pl 1.8s infinite}
@keyframes pl{50%{box-shadow:0 0 0 9px rgba(37,99,235,.05)}}
@media(prefers-reduced-motion:reduce){li.st.c .dot{animation:none}}
.tx b{display:block;font-size:16px;line-height:1.3}.tx small{color:var(--mut);font-size:13px}
li.st:not(.d):not(.c) .tx b{color:var(--mut);font-weight:600}
.msg{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:14.5px;background:rgba(37,99,235,.1)}
.full{min-height:70vh;display:grid;place-items:center;text-align:center;padding:30px 14px}.full .ic{font-size:52px}.full h2{margin:10px 0 6px}.full p{color:var(--mut);margin:0}
.btn{margin-top:16px;border:0;border-radius:14px;background:var(--pri);color:#fff;padding:13px 22px;font-size:15.5px;font-weight:700}
.upd{text-align:center;color:var(--mut);font-size:12.5px;margin-top:14px}
</style></head><body>
<header><h1 id="tn">Status Pesanan</h1><p id="ts">Memuat…</p></header>
<div class="wrap" id="app"><div class="full"><div><div class="ic">⏳</div><p>Memuat status…</p></div></div></div>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search),SID=q.get('s')||'',FULL=q.get('u')||'',TOK=(q.get('t')||'').replace(/[^A-Za-z0-9]/g,'');
var URLX=FULL||(SID?'https://script.google.com/macros/s/'+encodeURIComponent(SID)+'/exec':'');
if(URLX&&!/^https:\/\/script\.google\.com\//.test(URLX))URLX='';
var $=function(s){return document.querySelector(s)},T=null,LAST='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function two(n){return(n<10?'0':'')+n}
function fmt(ts){if(!ts)return'';var d=new Date(ts);return d.getDate()+'/'+two(d.getMonth()+1)+' '+two(d.getHours())+':'+two(d.getMinutes())}
function full(ic,h,p,btn){$('#app').innerHTML='<div class="full"><div><div class="ic">'+ic+'</div><h2>'+esc(h)+'</h2><p>'+esc(p)+'</p>'+(btn||'')+'</div></div>'}
function api(){
 var c=new AbortController(),t=setTimeout(function(){c.abort()},20000);
 var u=URLX+(URLX.indexOf('?')>-1?'&':'?')+'action=qjob&id='+encodeURIComponent(TOK)+'&_='+Date.now();
 return fetch(u,{redirect:'follow',signal:c.signal}).then(function(r){return r.json()}).finally(function(){clearTimeout(t)});
}
function draw(r){
 var last=r.steps.length-1,done=r.i>=last,at={};
 (r.hist||[]).forEach(function(h){at[h.i]=h.ts});
 document.title=(r.biz||'Status')+' · '+(r.no||'');
 $('#tn').textContent=r.biz||'Status Pesanan';
 $('#ts').textContent=r.no?'Pesanan '+r.no:'';
 var steps=r.steps.map(function(s,k){
  var cl=(k<r.i||(done&&k===r.i))?'d':k===r.i?'c':'';
  var when=at[k]?'<small>'+fmt(at[k])+'</small>':'';
  return'<li class="st '+cl+'"><div class="dot">'+(k<r.i||(done&&k===r.i)?'✓':(k+1))+'</div><div class="tx"><b>'+esc(s)+'</b>'+when+'</div></li>';
 }).join('');
 $('#app').innerHTML='<div class="card"><div class="now">Status saat ini</div><div class="big">'+esc(r.steps[r.i])+'</div><span class="chip'+(done?' done':'')+'">'+(done?'Selesai':'Sedang diproses')+'</span>'
  +'<div class="info">'+(r.name?'<div><span>Atas nama</span> <b>'+esc(r.name)+'</b></div>':'')+(r.desc?'<div><span>Pesanan</span> '+esc(r.desc)+'</div>':'')+'</div>'
  +(r.note?'<div class="msg">'+esc(r.note)+'</div>':'')+'</div>'
  +'<div class="card"><ol>'+steps+'</ol></div>'
  +'<div class="upd">Diperbarui '+esc(fmt(r.upd))+' · halaman ini menyegarkan diri otomatis</div>';
}
function load(first){
 api().then(function(r){
  if(!r||!r.ok){if(first)full('⚠️','Pesanan tidak ditemukan',(r&&r.err)||'Periksa kembali link dari toko.','<button class="btn" onclick="location.reload()">Coba lagi</button>');return}
  var k=JSON.stringify([r.i,r.upd,r.note]);if(k!==LAST){LAST=k;draw(r)}
  if(r.i>=r.steps.length-1){clearInterval(T);T=setInterval(function(){load(false)},120000)}
 }).catch(function(){if(first)full('📡','Tidak bisa memuat','Periksa koneksi internet, lalu coba lagi.','<button class="btn" onclick="location.reload()">Coba lagi</button>')});
}
if(!URLX||!TOK)full('⚠️','Link tidak valid','Minta link status yang benar dari toko.');
else{load(true);T=setInterval(function(){load(false)},15000);document.addEventListener('visibilitychange',function(){if(!document.hidden)load(false)})}
})();
</script></body></html>
